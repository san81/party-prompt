<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rapid Fire · Party Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('pg-theme')||'celebration'}catch(e){document.documentElement.dataset.theme='celebration'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--stage); color: var(--ink);
  font: 16px/1.45 var(--body);
  background-image: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--panel) 85%, var(--brass) 15%) 0%, transparent 60%);
  background-repeat: no-repeat; background-size: 100% 900px;
}
button, input, select, a { font: inherit; color: inherit; }
button, select { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }

/* Bar */
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 18px; letter-spacing: .02em; color: var(--brass); }
.spacer { margin-left: auto; }
.pill { font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.on { border-color: var(--mint); color: var(--mint); }
.pill.warn { border-color: var(--coral); color: var(--coral); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); text-decoration: none; }
.ghost[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }
.ghost[aria-pressed="false"] { text-decoration: line-through; }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px; }

/* Setup */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 42px); line-height: 1.05; margin: 0; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
label.field { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input[type=text], select { background: var(--stage); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1; min-width: 130px; }
.primary { background: var(--brass); color: var(--brass-ink); border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 16px; }
.primary:disabled { opacity: .4; cursor: default; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.teamrow { display: flex; gap: 12px; }
.teamrow .field { flex: 1; }
.swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 6px; }

/* Scoreboard */
.scores { display: flex; gap: 10px; align-items: stretch; }
.team { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; background: var(--panel); }
.team.active { border-color: var(--brass); box-shadow: var(--glow); }
.team .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .sc { margin-left: auto; font-family: var(--display); font-size: 22px; color: var(--brass); }
.turnline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.turnline .who { font-weight: 700; }
.turnline .rnd { color: var(--muted); font-size: 13px; }
.clock { margin-left: auto; font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; min-width: 2.4ch; text-align: right; }
.clock.hot { color: var(--coral); }
.meter { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brass); width: 100%; transition: width .2s linear; }
.meter.hot i { background: var(--coral); }

/* Image stage */
.imgwrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 240px;
  display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }
.imgwrap img { max-width: 100%; max-height: 46vh; border-radius: 8px; object-fit: contain; }
.imgwrap .ans { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 22px; color: var(--ink); text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.host { display: flex; gap: 8px; align-items: baseline; min-height: 1.4em; }
.host .mark { font-size: 11px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.host p { margin: 0; font-weight: 500; }
.live { min-height: 1.3em; color: var(--muted); font-style: italic; margin: 0; text-align: center; }
.feedback { min-height: 1.4em; text-align: center; font-weight: 700; margin: 0; }
.feedback.good { color: var(--mint); }
.feedback.bad { color: var(--coral); }

/* Controls */
.controls { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ptt { width: 118px; height: 118px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: inset 0 0 0 2px var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; touch-action: none; user-select: none; }
.ptt.live { box-shadow: inset 0 0 0 3px var(--coral), var(--glow); }
.ptt-ic { font-size: 38px; line-height: 1; }
.ptt-tx { font-size: 12px; font-weight: 700; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 15px; color: var(--ink); }
.btn.good { border-color: var(--mint); color: var(--mint); }
.btn.skip { border-color: var(--coral); color: var(--coral); }

/* Final */
.standings { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.standings li { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.standings li.win { border-color: var(--brass); box-shadow: var(--glow); }
.standings b { margin-left: auto; font-family: var(--display); color: var(--brass); font-size: 20px; }

/* Match log */
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.log header { display: flex; align-items: center; gap: 10px; }
.log h2 { font-size: 16px; margin: 0; margin-right: auto; }
.log .stats { font: 12px var(--mono); color: var(--muted); margin: 0; }
.log .scroll { overflow: auto; max-height: 42vh; }
.log table { width: 100%; border-collapse: collapse; font-size: 13px; }
.log th, .log td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log th { color: var(--muted); font-weight: 500; }
.log td.num { font-variant-numeric: tabular-nums; text-align: right; }
.log tr.correct td:first-child { color: var(--mint); }
.log tr.no td:first-child { color: var(--coral); }

/* Category description */
.catdesc { background: color-mix(in srgb, var(--panel) 70%, var(--stage)); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.catdesc b { color: var(--ink); }
.catdesc:empty { display: none; }
/* Hint */
.hint { min-height: 1.3em; text-align: center; margin: 0; font-weight: 600; color: var(--brass); }
.hint:empty { display: none; }
/* Reveal (turn end) — shows the answer and waits for the user */
.reveal { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0 2px; }
.reveal .big { font-family: var(--display); font-size: clamp(22px, 5vw, 34px); margin: 0; color: var(--ink); text-align: center; }
.reveal .sub { color: var(--muted); margin: 0; }
/* ? help button */
#helpBtn { width: 30px; text-align: center; font-weight: 700; }
/* Tour overlay */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5,2,14,.72); backdrop-filter: blur(3px); }
.tour { width: min(100%, 460px); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--glow); }
.tour .emoji { font-size: 44px; line-height: 1; }
.tour h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; color: var(--brass); }
.tour p { margin: 0; color: var(--ink); }
.tour .dots { display: flex; gap: 6px; justify-content: center; margin-top: 2px; }
.tour .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tour .dots span.on { background: var(--brass); }
.tour .nav { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.tour .nav .spacer { margin-left: auto; }

@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="ghost" href="/" id="menuBtn">← Menu</a>
    <span class="brand">Rapid Fire</span>
    <span class="pill" id="jevPill">…</span>
    <span class="spacer"></span>
    <button class="ghost" id="helpBtn" aria-label="How to play" title="How to play">?</button>
    <button class="ghost" id="soundBtn" aria-pressed="true">Sounds</button>
    <button class="ghost" id="hostBtn" aria-pressed="true">Host voice</button>
    <button class="ghost" id="logBtn" aria-pressed="false">Match log</button>
    <select class="ctl" id="langSel" aria-label="Language"></select>
    <select class="ctl" id="themeSel" aria-label="Theme"></select>
  </div>

  <!-- ===== Setup ===== -->
  <section class="card" id="setup">
    <h1 id="title">Spot it. Shout it.</h1>
    <p class="lede" id="lede">An image flashes up. Your team shouts what it is before the clock runs out. Name as many as you can in your window — the AI host judges each call.</p>
    <label class="field" for="category" id="lblCategory">Category
      <select id="category"></select>
    </label>
    <div class="catdesc" id="catDesc"></div>
    <div class="teamrow">
      <label class="field" id="lblTeam1">Team 1<input type="text" id="team1" maxlength="18" value="Pink"></label>
      <label class="field" id="lblTeam2">Team 2<input type="text" id="team2" maxlength="18" value="Blue"></label>
    </div>
    <div class="row">
      <label class="field" for="secs" id="lblSecs">Seconds per turn
        <select id="secs"><option value="15">15</option><option value="20" selected>20</option><option value="30">30</option><option value="45">45</option></select>
      </label>
      <label class="field" for="turns" id="lblTurns">Turns per team
        <select id="turns"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select>
      </label>
      <button class="primary" id="startBtn">Start game</button>
    </div>
    <p class="note" id="setupNote"></p>
  </section>

  <!-- ===== Turn intro ===== -->
  <section class="card" id="intro" hidden style="align-items:center;text-align:center;gap:18px">
    <p class="note" id="introRound"></p>
    <h1 id="introTeam"></h1>
    <p class="lede" id="introHint" style="text-align:center"></p>
    <button class="primary" id="introStart">Start turn</button>
  </section>

  <!-- ===== Play stage ===== -->
  <section id="stage" hidden style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div class="scores" id="scores"></div>
    <div class="turnline">
      <span class="who" id="who"></span>
      <span class="rnd" id="rnd"></span>
      <span class="clock" id="clock">20</span>
    </div>
    <div class="meter" id="meter"><i></i></div>
    <div class="imgwrap" id="imgwrap"><img id="img" alt="Name this"><div class="ans" id="ans"></div></div>
    <div class="host"><span class="mark">HOST</span><p id="caption"></p></div>
    <p class="hint" id="hint"></p>
    <p class="live" id="live"></p>
    <p class="feedback" id="feedback"></p>
    <div class="controls" id="controls">
      <button class="ptt" id="ptt" aria-label="Talk"><span class="ptt-ic">▶</span><span class="ptt-tx"></span></button>
      <div class="btnrow">
        <button class="btn good" id="gotBtn">Got it ✓</button>
        <button class="btn skip" id="skipBtn">Skip →</button>
        <button class="btn" id="endBtn">End turn</button>
      </div>
      <p class="note" id="stageNote"></p>
    </div>
    <div class="reveal" id="reveal" hidden>
      <p class="big" id="revealBig"></p>
      <p class="sub" id="revealSub"></p>
      <button class="primary" id="revealBtn">Next →</button>
    </div>
  </section>

  <!-- ===== Final ===== -->
  <section class="card" id="final" hidden>
    <h1 id="winner"></h1>
    <ol class="standings" id="standings"></ol>
    <div class="row"><button class="primary" id="againBtn">Play again</button><a class="ghost" href="/" id="menuBtn2">← Menu</a></div>
  </section>

  <!-- ===== Match log ===== -->
  <section class="log" id="log" hidden>
    <header>
      <h2>Match log</h2>
      <button class="ghost" id="copyLog">Copy as JSON</button>
    </header>
    <p class="stats" id="logStats">No guesses yet.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Category</th><th>Expected</th><th>Guess</th><th>Result</th><th>Source</th><th class="num">ms</th></tr></thead>
        <tbody id="logRows"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- ===== First-time walkthrough ===== -->
<div class="overlay" id="tour" hidden>
  <div class="tour">
    <span class="emoji" id="tourEmoji">⚡</span>
    <h2 id="tourTitle"></h2>
    <p id="tourBody"></p>
    <div class="dots" id="tourDots"></div>
    <div class="nav">
      <button class="ghost" id="tourSkip">Skip</button>
      <span class="spacer"></span>
      <button class="btn" id="tourBack">Back</button>
      <button class="primary" id="tourNext">Next</button>
    </div>
  </div>
</div>

<script src="/theme.js"></script>
<script src="/rapid/items.js"></script>
<script>

/* ================= sound (Web Audio, synthesised) ================= */
const Sound = (() => {
  let ctx = null, master;
  function init() { if (ctx) return ctx; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); return ctx; }
  function resume() { if (init() && ctx.state === 'suspended') ctx.resume(); }
  const ready = () => ctx && S.soundOn;
  const now = () => ctx.currentTime;
  function tone(freq, t, dur, peak, { type = 'sine', glide } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  return {
    resume,
    tick(urgent) { if (ready()) tone(urgent ? 1320 : 1100, now(), urgent ? 0.1 : 0.04, 0.3, { type: urgent ? 'square' : 'sine' }); },
    go() { if (!ready()) return; const t = now(); tone(880, t, 0.12, 0.3, { type: 'triangle' }); tone(1320, t + 0.1, 0.2, 0.25, { type: 'triangle' }); },
    correct() { if (!ready()) return; const t = now(); [784, 988, 1319].forEach((f, i) => tone(f, t + i * 0.06, 0.16, 0.3, { type: 'triangle' })); },
    wrong() { if (ready()) tone(220, now(), 0.22, 0.25, { type: 'sawtooth', glide: 150 }); },
    buzzer() { if (!ready()) return; const t = now(); tone(130, t, 0.6, 0.3, { type: 'sawtooth' }); tone(120, t, 0.6, 0.3, { type: 'sawtooth' }); },
    micOn() { if (ready()) tone(880, now(), 0.07, 0.25, { type: 'sine' }); },
    micOff() { if (ready()) tone(660, now(), 0.07, 0.2, { type: 'sine' }); },
    fanfare() { if (!ready()) return; const t = now() + 0.02; [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.1, 0.3, 0.3, { type: 'square' })); },
  };
})();

let voice = null, canSpeak = true;
function pickVoice() {
  if (!('speechSynthesis' in window)) { canSpeak = false; return; }
  const prefix = S.lang.split('-')[0];
  const all = speechSynthesis.getVoices();
  const vs = all.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(prefix));
  const lang = (v) => v.lang.replace('_', '-');
  voice = (prefix === 'en' && vs.find(v => lang(v) === 'en-IN'))
    || vs.find(v => lang(v) === S.lang && /Google|Samantha|Aria|Rishi|Natural/i.test(v.name))
    || vs.find(v => lang(v) === S.lang) || vs[0] || null;
  canSpeak = Boolean(voice) || (all.length === 0 && prefix === 'en');
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch {}
}
let audioUnlocked = false;
function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; Sound.resume(); pickVoice(); }

function say(text, { interrupt = false } = {}) {
  $('#caption').textContent = text;
  if (!S.hostOn || !canSpeak) return Promise.resolve();
  if (holding && !interrupt) return Promise.resolve();
  if (interrupt) speechSynthesis.cancel();
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang; if (voice) u.voice = voice;
    u.rate = S.lang === 'en-US' ? 1.08 : 1;
    let done = false; const finish = () => { if (done) return; done = true; resolve(); };
    u.onend = u.onerror = finish;
    try { speechSynthesis.resume(); } catch {}
    speechSynthesis.speak(u);
    setTimeout(finish, 1200 + text.length * 70);
  });
}

let rec = null, holding = false, listening = false, micReady = false, micResolved = false;
function warmMic() {
  if (micResolved) return;
  if (!navigator.mediaDevices?.getUserMedia) { micResolved = true; return; }
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then((s) => { s.getTracks().forEach(t => t.stop()); micReady = true; micResolved = true; })
    .catch(() => { micResolved = true; });
}
function startListening() {
  if (!SR || S.status !== 'playing') return;
  if (holding && listening) return renderMic();
  holding = true; Sound.micOn();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (listening) return renderMic();
  rec = new SR();
  rec.lang = STR[S.lang].speech || S.lang;
  rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) handleUtterance(r[0].transcript); else interim += r[0].transcript;
    }
    $('#live').textContent = interim;
  };
  rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') $('#stageNote').textContent = T().micBlocked; };
  rec.onend = () => { listening = false; renderMic(); if (holding && S.status === 'playing') startListening(); };
  try { rec.start(); listening = true; } catch {}
  renderMic();
}
function stopListening() { holding = false; Sound.micOff(); try { rec && rec.stop(); } catch {} renderMic(); }
function renderMic() {
  const b = $('#ptt');
  b.classList.toggle('live', holding);
  b.querySelector('.ptt-ic').textContent = holding ? '⏸' : '▶';
  b.querySelector('.ptt-tx').textContent = holding ? T().listening : T().talk;
}

/* ================= matching ================= */
// Single letters barely survive speech recognition, so match them locally against the
// spoken letter name (ay/bee/see…) or the first letter of whatever was heard.
const LETTER_NAMES = { a:['a','ay','eh','hey'], b:['b','be','bee'], c:['c','see','sea'], d:['d','dee'], e:['e','ee'], f:['f','ef','eff'], g:['g','gee','jee'], h:['h','aitch','aich','hech'], i:['i','eye','ai'], j:['j','jay'], k:['k','kay','okay'], l:['l','el','ell'], m:['m','em'], n:['n','en'], o:['o','oh','owe'], p:['p','pee','pea'], q:['q','cue','queue','kyu'], r:['r','ar','are'], s:['s','es','ess'], t:['t','tee','tea'], u:['u','you','yu','ewe'], v:['v','vee'], w:['w','double u','doubleyou'], x:['x','ex','eks'], y:['y','why','wy'], z:['z','zee','zed'] };
function matchesLetter(text, letter) {
  const n = text.toLowerCase().replace(/[^a-z ]/g, '').trim();
  const l = letter.toLowerCase();
  if (n === l) return true;
  if ((LETTER_NAMES[l] || []).includes(n)) return true;
  const first = (n.split(/\s+/)[0] || '')[0];   // "apple" -> 'a' (lenient; party game)
  return first === l;
}

async function handleUtterance(text) {
  text = (text || '').trim();
  $('#live').textContent = '';
  if (!text || S.status !== 'playing' || !S.item) return;
  const expected = S.item.answer, seq = ++S.seq;
  if (expected.length === 1) {   // alphabet / prior: decide locally, don't bother the server
    const ok = matchesLetter(text, expected);
    logRow({ expected: expectedLabel(), guess: text, result: ok ? 'correct' : 'no', source: 'local', ms: 0 });
    if (ok) scoreCorrect();
    else { $('#feedback').textContent = `"${text}" — ${T().notQuite}`; $('#feedback').className = 'feedback bad'; }
    return;
  }
  const exLabel = expectedLabel();
  // local fast path then Jev (inside matchOne on the server)
  try {
    const r = await fetch('/api/match-one', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ expected, guess: text, category: S.category.en }),
    }).then(x => x.json());
    if (seq !== S.seq || S.status !== 'playing') return;      // a newer guess/turn superseded this
    logRow({ expected: exLabel, guess: text, result: r.match ? 'correct' : 'no', source: r.source, score: r.score, ms: r.latencyMs, jev: r.jev, error: r.error });
    if (r.match) scoreCorrect();
    else { $('#feedback').textContent = `"${text}" — ${T().notQuite}`; $('#feedback').className = 'feedback bad'; }
  } catch {
    if (seq === S.seq) { logRow({ expected: exLabel, guess: text, result: 'error', source: 'local', error: 'network' }); $('#feedback').textContent = T().notQuite; $('#feedback').className = 'feedback bad'; }
  }
}

function scoreCorrect() {
  if (S.status !== 'playing') return;
  S.teams[S.curTeam].score++; S.turnScore++;
  Sound.correct();
  $('#feedback').textContent = T().scored(S.teams[S.curTeam].name); $('#feedback').className = 'feedback good';
  say(T().sayCorrect(S.item.answer));
  renderScores();
  nextImage();
}

/* ================= game flow ================= */
function buildCategorySelect() {
  const sel = $('#category');
  sel.innerHTML = (window.RAPID_CATEGORIES || []).map(c => `<option value="${c.key}">${esc(c[S.lang === 'te-IN' ? 'te' : 'en'])} (${c.count})</option>`).join('');
}
function startGame() {
  unlockAudio();
  const catKey = $('#category').value;
  S.category = (window.RAPID_CATEGORIES || []).find(c => c.key === catKey);
  if (!S.category) { $('#setupNote').textContent = 'Pick a category.'; return; }
  S.teams = [
    { name: $('#team1').value.trim() || 'Team 1', score: 0 },
    { name: $('#team2').value.trim() || 'Team 2', score: 0 },
  ];
  S.turnSecs = Number($('#secs').value);
  S.turnsPerTeam = Number($('#turns').value);
  S.totalTurns = S.turnsPerTeam * 2;
  S.deck = shuffle([...(window.RAPID_ITEMS[catKey] || [])]);
  S.curTeam = 0; S.turnNo = 0;
  $('#setup').hidden = true; $('#final').hidden = true;
  beginTurn();
}

function beginTurn() {
  S.turnNo++;
  S.status = 'intro'; S.turnScore = 0; S.warned = false; S.lastSec = null;
  const team = S.teams[S.curTeam];
  $('#stage').hidden = true; $('#final').hidden = true; $('#intro').hidden = false;
  const roundNo = Math.ceil(S.turnNo / 2);
  $('#introRound').textContent = T().round(roundNo, S.turnsPerTeam);
  $('#introTeam').textContent = T().teamReady(team.name);
  $('#introHint').textContent = T().introHint;
  $('#introStart').textContent = T().startTurn;
  say(T().sayReady(team.name), { interrupt: true });
}

function startTurn() {
  warmMic();
  $('#intro').hidden = true; $('#stage').hidden = false;
  $('#reveal').hidden = true; $('#controls').hidden = false;
  $('#who').textContent = S.teams[S.curTeam].name;
  $('#rnd').textContent = T().round(Math.ceil(S.turnNo / 2), S.turnsPerTeam);
  $('#feedback').textContent = ''; $('#live').textContent = ''; $('#hint').textContent = '';
  const notes = [];
  if (S.hostOn && !canSpeak) notes.push(T().noVoice);
  if (S.category.imgDir === 'letters') notes.push(T().alphabetNote);
  $('#stageNote').textContent = notes.join('  ');
  renderScores(); renderMic();
  setClock(S.turnSecs);
  nextImage();
  fetch('/api/warm', { method: 'POST' }).catch(() => {});
  const startWhenReady = () => {
    if (S.status !== 'intro' && S.status !== 'ready') return;
    if (micResolved) startClock(); else setTimeout(startWhenReady, 150);
  };
  S.status = 'ready';
  startWhenReady();
}

function startClock() {
  if (S.status !== 'ready') return;
  S.status = 'playing';
  S.deadline = Date.now() + S.turnSecs * 1000;
  Sound.go(); say(T().sayGo);
  startListening();
  clearInterval(S.clockTimer);
  S.clockTimer = setInterval(() => {
    const left = Math.max(0, (S.deadline - Date.now()) / 1000);
    setClock(left);
    const sec = Math.ceil(left);
    if (sec !== S.lastSec) { S.lastSec = sec; if (sec <= 5 && sec > 0) Sound.tick(sec <= 3); }
    maybeHint();
    if (left <= 0) endTurn();
  }, 100);
}
function setClock(left) {
  const hot = S.status === 'playing' && left <= 5;
  $('#clock').textContent = Math.ceil(left);
  $('#clock').classList.toggle('hot', hot);
  $('#meter').classList.toggle('hot', hot);
  $('#meter i').style.width = `${(left / S.turnSecs) * 100}%`;
}

function nextImage() {
  if (!S.deck.length) S.deck = shuffle([...(window.RAPID_ITEMS[S.category.key] || [])]);
  S.item = S.deck.pop();
  S.seq++;    // invalidate any in-flight guess for the previous image
  S.imgShownAt = Date.now(); S.hintLevel = 0;
  $('#hint').textContent = ''; $('#ans').textContent = '';
  $('#img').src = `/rapid/items/${S.category.imgDir || S.category.key}/${S.item.file}`;
  $('#img').alt = 'Name this';
}

// Hint ladder: a semantic hint (authored for animals) or a category hint first, then a
// first-letter + length hint. Fires after the player dwells on the same image.
function hintText(level) {
  if (!S.item) return '';
  const te = S.lang === 'te-IN';
  if (S.category.imgDir === 'letters') {   // single-letter rounds: nudge the rule, never reveal the letter
    if (S.category.key === 'priorAlphabet') return te ? `"${S.item.shown}" కి ముందు వచ్చే అక్షరం ఏది?` : `Which letter comes just before "${S.item.shown}"?`;
    return te ? 'కనిపించే అక్షరాన్నే చెప్పండి' : 'Just say the letter you see';
  }
  const ans = S.item.answer;
  const authored = (HINTS[S.category.key] || {})[ans];
  if (level === 1) {
    if (authored) return (te ? authored.te : authored.en) || authored.en;
    return T().hintCat(S.category[te ? 'te' : 'en']);
  }
  const letters = ans.replace(/[^A-Za-z]/g, '').length;
  return T().hintLetter(ans[0].toUpperCase(), letters);
}
function maybeHint() {
  if (S.status !== 'playing' || !S.item) return;
  const on = (Date.now() - S.imgShownAt) / 1000;
  if (S.hintLevel < 1 && on >= 4) { S.hintLevel = 1; $('#hint').textContent = '💡 ' + hintText(1); }
  else if (S.hintLevel < 2 && on >= 8) { S.hintLevel = 2; $('#hint').textContent = '💡 ' + hintText(2); }
}

function skipImage() {
  if (S.status !== 'playing') return;
  logRow({ expected: expectedLabel(), guess: '—', result: 'skip', source: 'manual' });
  $('#feedback').textContent = T().skipped(S.item.answer); $('#feedback').className = 'feedback bad';
  Sound.wrong();
  nextImage();
}

function endTurn() {
  if (S.status !== 'playing' && S.status !== 'ready') return;
  S.status = 'reveal';
  clearInterval(S.clockTimer); setClock(0);
  stopListening(); renderMic();
  Sound.buzzer();
  const team = S.teams[S.curTeam];
  say(T().sayTimeUp(team.name, S.turnScore), { interrupt: true });
  // Reveal the answer the team was stuck on and WAIT — don't auto-advance to scores.
  // Leave any hint on screen so a player who saw it can still connect it to the answer.
  $('#feedback').textContent = '';
  const revealAns = (S.category.key === 'priorAlphabet' && S.item) ? `${S.item.shown} → ${S.item.answer}` : (S.item ? S.item.answer : '');
  if (S.item) $('#ans').textContent = S.item.answer;
  $('#controls').hidden = true;
  $('#reveal').hidden = false;
  $('#revealBig').textContent = revealAns ? T().answerWas(revealAns) : '';
  $('#revealSub').textContent = T().found(S.turnScore);
  $('#revealBtn').textContent = S.turnNo >= S.totalTurns ? T().seeScores : T().nextTeam(S.teams[1 - S.curTeam].name);
}
function proceedAfterReveal() {
  $('#reveal').hidden = true; $('#controls').hidden = false;
  if (S.turnNo >= S.totalTurns) return finish();
  S.curTeam = 1 - S.curTeam;
  beginTurn();
}

function finish() {
  S.status = 'final';
  $('#stage').hidden = true; $('#intro').hidden = true; $('#final').hidden = false;
  const ranked = [...S.teams].sort((a, b) => b.score - a.score);
  const tie = ranked[0].score === ranked[1].score;
  $('#winner').textContent = tie ? T().tieTitle : T().winTitle(ranked[0].name);
  $('#standings').innerHTML = ranked.map((t, i) => `<li class="${i === 0 && !tie ? 'win' : ''}"><span class="nm">${esc(t.name)}</span><b>${t.score}</b></li>`).join('');
  $('#againBtn').textContent = T().playAgain;
  Sound.fanfare();
  say(tie ? T().sayTie : T().sayWin(ranked[0].name, ranked[0].score), { interrupt: true });
}

function renderScores() {
  $('#scores').innerHTML = S.teams.map((t, i) =>
    `<div class="team ${i === S.curTeam && (S.status === 'playing' || S.status === 'ready') ? 'active' : ''}"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></div>`).join('');
}

/* ================= i18n apply ================= */
function applyLang(code) {
  S.lang = STR[code] ? code : 'en-US';
  document.documentElement.lang = S.lang.split('-')[0];
  pickVoice();
  const t = T();
  $('#title').textContent = t.title; $('#lede').textContent = t.lede;
  $('#lblCategory').childNodes[0].textContent = t.category;
  $('#lblTeam1').childNodes[0].textContent = t.team1;
  $('#lblTeam2').childNodes[0].textContent = t.team2;
  $('#lblSecs').childNodes[0].textContent = t.secsPerTurn;
  $('#lblTurns').childNodes[0].textContent = t.turnsPerTeam;
  $('#startBtn').textContent = t.start;
  $('#gotBtn').textContent = t.got; $('#skipBtn').textContent = t.skip; $('#endBtn').textContent = t.endTurn;
  const curCat = $('#category').value;
  buildCategorySelect();
  if (curCat) $('#category').value = curCat;      // keep the chosen category across a language switch
  showCatDesc();
  renderMic();
  if (!$('#stage').hidden) { renderScores(); }
  if (!$('#tour').hidden) renderTour();
}

/* ================= category description + tour ================= */
function showCatDesc() {
  const info = CAT_INFO[$('#category').value];
  const d = $('#catDesc');
  if (!info) { d.innerHTML = ''; return; }
  const x = info[S.lang === 'te-IN' ? 'te' : 'en'] || info.en;
  d.innerHTML = esc(x.desc) + (x.eg ? ` <b>${esc(T().egLabel)}:</b> ${esc(x.eg)}` : '');
}

let tourStep = 0;
function renderTour() {
  const steps = T().tour, s = steps[tourStep];
  $('#tourEmoji').textContent = s.emoji; $('#tourTitle').textContent = s.title; $('#tourBody').textContent = s.body;
  $('#tourDots').innerHTML = steps.map((_, i) => `<span class="${i === tourStep ? 'on' : ''}"></span>`).join('');
  $('#tourBack').style.visibility = tourStep === 0 ? 'hidden' : 'visible';
  $('#tourBack').textContent = T().tourBack; $('#tourSkip').textContent = T().tourSkip;
  $('#tourNext').textContent = tourStep === steps.length - 1 ? T().tourDone : T().tourNext;
}
function openTour(force) {
  if (!force) { try { if (localStorage.getItem('rapid-tour-done')) return; } catch {} }
  tourStep = 0; $('#tour').hidden = false; renderTour();
}
function closeTour() { $('#tour').hidden = true; try { localStorage.setItem('rapid-tour-done', '1'); } catch {} }

/* ================= wiring ================= */
document.addEventListener('pointerdown', unlockAudio);
$('#startBtn').onclick = startGame;
$('#category').addEventListener('change', showCatDesc);
$('#introStart').onclick = () => { unlockAudio(); startTurn(); };
$('#gotBtn').onclick = () => { if (S.status === 'playing') { logRow({ expected: expectedLabel(), guess: '(host)', result: 'got it', source: 'manual' }); scoreCorrect(); } };
$('#skipBtn').onclick = skipImage;
$('#endBtn').onclick = endTurn;
$('#logBtn').onclick = (e) => { const on = $('#log').hidden; $('#log').hidden = !on; e.currentTarget.setAttribute('aria-pressed', on); if (on) renderLog(); };
$('#copyLog').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(S.log, null, 2)); $('#copyLog').textContent = 'Copied'; } catch { $('#copyLog').textContent = 'Copy failed'; } setTimeout(() => ($('#copyLog').textContent = 'Copy as JSON'), 1500); };
$('#revealBtn').onclick = proceedAfterReveal;
$('#helpBtn').onclick = () => openTour(true);
$('#tourNext').onclick = () => { const n = T().tour.length; if (tourStep < n - 1) { tourStep++; renderTour(); } else closeTour(); };
$('#tourBack').onclick = () => { if (tourStep > 0) { tourStep--; renderTour(); } };
$('#tourSkip').onclick = closeTour;
$('#againBtn').onclick = () => { $('#final').hidden = true; $('#setup').hidden = false; S.status = 'setup'; };
$('#ptt').addEventListener('click', () => { unlockAudio(); holding ? stopListening() : startListening(); });
$('#soundBtn').onclick = (e) => { S.soundOn = !S.soundOn; e.currentTarget.setAttribute('aria-pressed', S.soundOn); };
$('#hostBtn').onclick = (e) => { S.hostOn = !S.hostOn; e.currentTarget.setAttribute('aria-pressed', S.hostOn); if (!S.hostOn && 'speechSynthesis' in window) speechSynthesis.cancel(); };
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat || ['INPUT', 'SELECT', 'BUTTON', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (!$('#stage').hidden) { e.preventDefault(); holding ? stopListening() : startListening(); }
});

async function boot() {
  Shell.fillThemeSelect($('#themeSel'));
  let locales = window.LOCALES_UI;
  try {
    const data = await fetch('/api/topics').then(r => r.json());
    if (data.locales) locales = Object.fromEntries(Object.entries(data.locales).map(([k, v]) => [k, v.name]));
  } catch {}
  Shell.fillLangSelect($('#langSel'), locales);
  applyLang(Shell.getLang());
  window.addEventListener('langchange', (e) => applyLang(e.detail));
  try {
    const st = await fetch('/api/status').then(r => r.json());
    S.jev = st.jev;
    const pill = $('#jevPill');
    pill.textContent = st.jev ? `Jev · ${st.model}` : 'Local only';
    pill.className = 'pill ' + (st.jev ? 'on' : 'warn');
  } catch {
    $('#jevPill').textContent = 'Server offline'; $('#jevPill').className = 'pill warn';
    $('#setupNote').textContent = T().serverOff; $('#startBtn').disabled = true;
  }
  setToggle();
  showCatDesc();
  openTour(false);   // first-time walkthrough
}
function setToggle() { $('#soundBtn').setAttribute('aria-pressed', S.soundOn); $('#hostBtn').setAttribute('aria-pressed', S.hostOn); }
boot();
</script>
</body>
</html>
